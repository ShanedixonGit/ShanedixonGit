name: Generate Snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ShanedixonGit
          outputs: |
            dist/github-snake.svg?color_snake=#DA3633&color_dots=#EBEDF0,#FFCECB,#FF9492,#F85149,#B62324
            dist/github-snake-dark.svg?color_snake=#FF7B72&color_dots=#161B22,#5C1E1E,#8E1519,#DA3633,#F85149

      - name: Render activity graph and quote
        run: |
          sudo chown -R "$USER" dist
          python3 scripts/render.py
        env:
          GH_USER: ShanedixonGit
          OUT_DIR: dist

      - name: Show published files
        run: ls -la dist

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
